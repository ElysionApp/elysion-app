<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elysion App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #35206b 0%, #151329 42%, #080812 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      background: linear-gradient(90deg, #c69cff, #ffffff, #76dfff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 12px 0 35px;
      color: #c9c5db;
      line-height: 1.6;
    }

    .card {
      padding: 24px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .card h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 16px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: linear-gradient(90deg, #7c4dff, #b14cff);
    }

    button:active {
      transform: scale(.98);
    }

    .signature {
      margin-top: 30px;
      font-family: cursive;
      font-size: 22px;
      opacity: .85;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">✨</div>

    <h1>Elysion</h1>

    <p class="subtitle">
      Donnez vie à votre imagination.<br>
      Images, prompts interactifs et univers créatifs.
    </p>

    <section class="card">

      <h2>Bienvenue dans Elysion</h2>

      <p>
        Choisissez votre expérience créative.
      </p>

      <button onclick="alert('Création d’image — bientôt disponible ✨')">
        🎨 Créer une image
      </button>

      <button onclick="alert('Prompts interactifs — bientôt disponibles ✨')">
        ✨ Prompt interactif
      </button>

      <button onclick="alert('Univers Elysion — bientôt disponible ✨')">
        🌙 Explorer Elysion
      </button>

    </section>

    <div class="signature">
      Elysion
    </div>

  </main>

</body>
</html>
